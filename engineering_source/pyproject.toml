[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nhs-primary-care-intelligence"
version = "0.1.0"
description = "Fully synthetic NHS-style primary care data administration portfolio simulation"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
  "pandas>=2.2,<4",
  "numpy>=2.0,<3",
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"